<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex's Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E0DDD6;
    --text: #1A1815;
    --muted: #8C897F;
    --accent: #2D5A8E;
    --today-bg: #2D5A8E;
    --today-text: #fff;
    --event-bg: #EAF1FA;
    --event-text: #185FA5;
    --hover: #F2F0EB;
    --overlay: rgba(26,24,21,0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161A;
      --surface: #222027;
      --border: #333039;
      --text: #F0EDE8;
      --muted: #7A7780;
      --accent: #5B9BD5;
      --today-bg: #5B9BD5;
      --today-text: #fff;
      --event-bg: #1A2A3D;
      --event-text: #85B7EB;
      --hover: #2A2830;
      --overlay: rgba(0,0,0,0.5);
    }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2rem; }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .calendar {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .cal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--text);
  }

  .nav-group { display: flex; gap: 6px; }

  .nav-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px; height: 36px;
    cursor: pointer;
    color: var(--text);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: var(--hover); }

  .today-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 14px; height: 36px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.15s, color 0.15s;
  }
  .today-btn:hover { background: var(--hover); color: var(--text); }

  .day-headers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .day-hdr {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); text-align: center; padding: 10px 0;
  }

  .day-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

  .day-cell {
    min-height: 90px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 8px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
    min-width: 0;
    overflow: hidden;
  }
  .day-cell:nth-child(7n) { border-right: none; }
  .day-cell:hover { background: var(--hover); }

  .day-num {
    font-size: 13px; font-weight: 400;
    color: var(--muted); line-height: 1;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .day-num.current-month { color: var(--text); }
  .day-num.today { background: var(--today-bg); color: var(--today-text); font-weight: 500; }

  /* Small event dots on the grid */
  .mini-event {
    font-size: 11px;
    background: var(--event-bg);
    color: var(--event-text);
    border-radius: 4px;
    padding: 2px 5px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    display: block;
  }

  .add-hint {
    font-size: 11px; color: var(--muted);
    margin-top: 4px; opacity: 0;
    transition: opacity 0.15s;
  }
  .day-cell:hover .add-hint { opacity: 1; }

  /* ── Overlay ── */
  .overlay {
    position: fixed; inset: 0;
    background: var(--overlay);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }

  /* ── Day panel ── */
  .day-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 360px;
    max-height: 80vh;
    display: flex; flex-direction: column;
    animation: pop 0.18s ease;
    overflow: hidden;
  }
  @keyframes pop {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .day-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 1.25rem 0.9rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .day-panel-header h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem; font-weight: 400;
    color: var(--text);
  }
  .panel-close {
    background: none; border: none;
    font-size: 18px; cursor: pointer;
    color: var(--muted); line-height: 1;
    padding: 2px 4px;
    transition: color 0.12s;
  }
  .panel-close:hover { color: var(--text); }

  .day-panel-events {
    flex: 1; overflow-y: auto;
    padding: 0.75rem 1.25rem;
  }

  .day-panel-empty {
    font-size: 13px; color: var(--muted);
    padding: 0.5rem 0;
  }

  .panel-event-row {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--event-bg);
    color: var(--event-text);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px; line-height: 1.5;
  }
  .panel-event-row span { flex: 1; word-break: break-word; }
  .panel-action-btns { display: flex; gap: 4px; flex-shrink: 0; margin-top: 1px; }
  .panel-edit, .panel-del {
    background: none; border: none;
    cursor: pointer; color: var(--event-text);
    font-size: 13px; opacity: 0.45;
    padding: 0;
    transition: opacity 0.12s;
  }
  .panel-edit:hover, .panel-del:hover { opacity: 1; }

  .panel-event-row.editing { background: var(--bg); padding: 4px 6px; }
  .edit-input {
    flex: 1;
    padding: 5px 8px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  .edit-save {
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px;
    padding: 5px 10px; font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; white-space: nowrap;
    flex-shrink: 0;
  }
  .edit-cancel {
    background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px;
    font-size: 12px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; color: var(--muted); flex-shrink: 0;
  }

  .day-panel-footer {
    padding: 0.75rem 1.25rem 1rem;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .add-event-row {
    display: flex; gap: 8px;
  }
  .add-event-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .add-event-row input:focus { border-color: var(--accent); }
  .add-event-row button {
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    padding: 0 14px; font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; white-space: nowrap;
    transition: opacity 0.15s;
  }
  .add-event-row button:hover { opacity: 0.88; }

  .footer {
    margin-top: 1.5rem;
    font-size: 12px; color: var(--muted); text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Alex's Calendar</h1>
  <p>Click any day to view and add events</p>
</header>

<div class="calendar">
  <div class="cal-nav">
    <div class="nav-group">
      <button class="nav-btn" onclick="changeMonth(-1)" title="Previous month">&#8592;</button>
      <button class="nav-btn" onclick="changeMonth(1)" title="Next month">&#8594;</button>
    </div>
    <div class="cal-title" id="cal-title"></div>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>
  <div class="day-headers" id="day-hdrs"></div>
  <div class="day-grid" id="day-grid"></div>
</div>

<div class="footer">Events are saved in your browser &mdash; they persist between visits.</div>

<!-- Day detail overlay -->
<div class="overlay" id="overlay">
  <div class="day-panel" id="day-panel">
    <div class="day-panel-header">
      <h3 id="panel-title"></h3>
      <button class="panel-close" onclick="closePanel()">&#x2715;</button>
    </div>
    <div class="day-panel-events" id="panel-events"></div>
    <div class="day-panel-footer">
      <div class="add-event-row">
        <input type="text" id="panel-input" placeholder="Add an event..." maxlength="80" />
        <button onclick="panelAddEvent()">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const today  = new Date();
let cur = new Date(today.getFullYear(), today.getMonth(), 1);
let activeKey = null;

function loadEvents(){ try{ return JSON.parse(localStorage.getItem('cal-events')||'{}'); }catch(e){ return {}; } }
function saveEvents(ev){ localStorage.setItem('cal-events', JSON.stringify(ev)); }
function dayKey(y,m,d){ return y+'-'+(m+1)+'-'+d; }

function render(){
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById('cal-title').textContent = MONTHS[m]+' '+y;
  document.getElementById('day-hdrs').innerHTML = DAYS.map(d=>`<div class="day-hdr">${d}</div>`).join('');

  const events = loadEvents();
  const first = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  let cells = '';

  for(let i=0;i<first;i++){
    const d = prevDays-first+1+i;
    cells += `<div class="day-cell" style="opacity:0.4"><div class="day-num">${d}</div></div>`;
  }

  for(let d=1;d<=daysInMonth;d++){
    const k = dayKey(y,m,d);
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
    const numClass = 'day-num current-month'+(isToday?' today':'');
    // Show up to 2 mini pills, then a count
    const evList = events[k]||[];
    const shown = evList.slice(0,2).map(e=>`<div class="mini-event">${e}</div>`).join('');
    const extra = evList.length>2 ? `<div class="mini-event">+${evList.length-2} more</div>` : '';
    cells += `<div class="day-cell" onclick="openPanel('${k}',${d})">
      <div class="${numClass}">${d}</div>
      ${shown}${extra}
      <div class="add-hint">+ add</div>
    </div>`;
  }

  const remaining = 42-first-daysInMonth;
  for(let d=1;d<=remaining;d++){
    cells += `<div class="day-cell" style="opacity:0.4"><div class="day-num">${d}</div></div>`;
  }

  document.getElementById('day-grid').innerHTML = cells;
}

function renderPanel(){
  if(!activeKey) return;
  const events = loadEvents();
  const evList = events[activeKey]||[];
  const container = document.getElementById('panel-events');
  if(evList.length===0){
    container.innerHTML = `<p class="day-panel-empty">No events — add one below.</p>`;
    return;
  }
  container.innerHTML = evList.map((e,i)=>`
    <div class="panel-event-row" id="evrow-${i}">
      <span>${e}</span>
      <div class="panel-action-btns">
        <button class="panel-edit" onclick="startEdit(${i})" title="Edit">&#9998;</button>
        <button class="panel-del" onclick="panelDeleteEvent(${i})" title="Delete">&#x2715;</button>
      </div>
    </div>`).join('');
}

function startEdit(idx){
  const events = loadEvents();
  const val = (events[activeKey]||[])[idx]||'';
  const row = document.getElementById('evrow-'+idx);
  row.classList.add('editing');
  row.innerHTML = `
    <input class="edit-input" id="edit-input-${idx}" type="text" value="${val.replace(/"/g,'&quot;')}" maxlength="80" />
    <button class="edit-save" onclick="saveEdit(${idx})">Save</button>
    <button class="edit-cancel" onclick="renderPanel()">Cancel</button>
  `;
  const inp = document.getElementById('edit-input-'+idx);
  inp.focus();
  inp.selectionStart = inp.selectionEnd = inp.value.length;
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter') saveEdit(idx);
    if(e.key==='Escape') renderPanel();
  });
}

function saveEdit(idx){
  const inp = document.getElementById('edit-input-'+idx);
  if(!inp) return;
  const val = inp.value.trim();
  if(!val) return;
  const events = loadEvents();
  if(events[activeKey]) events[activeKey][idx] = val;
  saveEvents(events);
  renderPanel();
  render();
}

function openPanel(k, d){
  activeKey = k;
  const [y,m] = k.split('-');
  document.getElementById('panel-title').textContent = MONTHS[parseInt(m)-1]+' '+d+', '+y;
  document.getElementById('panel-input').value = '';
  renderPanel();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('panel-input').focus(), 80);
}

function closePanel(){
  document.getElementById('overlay').classList.remove('open');
  activeKey = null;
}

function panelAddEvent(){
  const val = document.getElementById('panel-input').value.trim();
  if(!val||!activeKey) return;
  const events = loadEvents();
  if(!events[activeKey]) events[activeKey]=[];
  events[activeKey].push(val);
  saveEvents(events);
  document.getElementById('panel-input').value = '';
  renderPanel();
  render();
}

function panelDeleteEvent(idx){
  const events = loadEvents();
  if(events[activeKey]){ events[activeKey].splice(idx,1); }
  if(events[activeKey]&&events[activeKey].length===0) delete events[activeKey];
  saveEvents(events);
  renderPanel();
  render();
}

function changeMonth(dir){ cur.setMonth(cur.getMonth()+dir); render(); }
function goToday(){ cur = new Date(today.getFullYear(), today.getMonth(), 1); render(); }

document.getElementById('panel-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') panelAddEvent();
  if(e.key==='Escape') closePanel();
});
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('overlay')) closePanel();
});

render();
</script>
</body>
</html>
