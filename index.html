<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex's Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0; --surface: #FFFFFF; --border: #E0DDD6;
    --text: #1A1815; --muted: #8C897F; --accent: #2D5A8E;
    --today-bg: #2D5A8E; --today-text: #fff;
    --event-bg: #EAF1FA; --event-text: #185FA5;
    --hover: #F2F0EB; --overlay: rgba(26,24,21,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161A; --surface: #222027; --border: #333039;
      --text: #F0EDE8; --muted: #7A7780; --accent: #5B9BD5;
      --today-bg: #5B9BD5; --today-text: #fff;
      --event-bg: #1A2A3D; --event-text: #85B7EB;
      --hover: #2A2830; --overlay: rgba(0,0,0,0.5);
    }
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 2.2rem; font-weight: 400; letter-spacing: -0.5px; color: var(--text); }
  header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .sync-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .sync-dot.ok { background: #4caf50; }
  .sync-dot.err { background: #e53935; }
  .sync-dot.loading { background: #f5a623; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .calendar { width: 100%; max-width: 780px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
  .cal-title { font-family: 'DM Serif Display', serif; font-size: 1.4rem; font-weight: 400; color: var(--text); }
  .nav-group { display: flex; gap: 6px; }
  .nav-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; color: var(--text); font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .nav-btn:hover { background: var(--hover); }
  .today-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0 14px; height: 36px; cursor: pointer; color: var(--muted); font-size: 13px; font-family: 'DM Sans', sans-serif; transition: background 0.15s, color 0.15s; }
  .today-btn:hover { background: var(--hover); color: var(--text); }

  .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .day-hdr { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 10px 0; }
  .day-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .day-cell { min-height: 90px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px; cursor: pointer; transition: background 0.12s; position: relative; min-width: 0; overflow: hidden; }
  .day-cell:nth-child(7n) { border-right: none; }
  .day-cell:hover { background: var(--hover); }
  .day-num { font-size: 13px; font-weight: 400; color: var(--muted); line-height: 1; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .day-num.current-month { color: var(--text); }
  .day-num.today { background: var(--today-bg); color: var(--today-text); font-weight: 500; }
  .mini-event { font-size: 11px; background: var(--event-bg); color: var(--event-text); border-radius: 4px; padding: 2px 5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: block; }
  .add-hint { font-size: 11px; color: var(--muted); margin-top: 4px; opacity: 0; transition: opacity 0.15s; }
  .day-cell:hover .add-hint { opacity: 1; }

  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
  .overlay.open { display: flex; }
  .day-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 360px; max-height: 80vh; display: flex; flex-direction: column; animation: pop 0.18s ease; overflow: hidden; }
  @keyframes pop { from{transform:scale(0.94);opacity:0} to{transform:scale(1);opacity:1} }
  .day-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.25rem 0.9rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .day-panel-header h3 { font-family: 'DM Serif Display', serif; font-size: 1.15rem; font-weight: 400; color: var(--text); }
  .panel-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); line-height: 1; padding: 2px 4px; transition: color 0.12s; }
  .panel-close:hover { color: var(--text); }
  .day-panel-events { flex: 1; overflow-y: auto; padding: 0.75rem 1.25rem; }
  .day-panel-empty { font-size: 13px; color: var(--muted); padding: 0.5rem 0; }
  .panel-event-row { display: flex; align-items: flex-start; gap: 8px; background: var(--event-bg); color: var(--event-text); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; line-height: 1.5; }
  .panel-event-row span { flex: 1; word-break: break-word; }
  .panel-action-btns { display: flex; gap: 4px; flex-shrink: 0; margin-top: 1px; }
  .panel-edit, .panel-del { background: none; border: none; cursor: pointer; color: var(--event-text); font-size: 13px; opacity: 0.45; padding: 0; transition: opacity 0.12s; }
  .panel-edit:hover, .panel-del:hover { opacity: 1; }
  .panel-event-row.editing { background: var(--bg); padding: 4px 6px; }
  .edit-input { flex: 1; padding: 5px 8px; border: 1px solid var(--accent); border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); color: var(--text); outline: none; }
  .edit-save { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .edit-cancel { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--muted); flex-shrink: 0; }
  .day-panel-footer { padding: 0.75rem 1.25rem 1rem; border-top: 1px solid var(--border); flex-shrink: 0; }
  .add-event-row { display: flex; gap: 8px; }
  .add-event-row input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
  .add-event-row input:focus { border-color: var(--accent); }
  .add-event-row button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 14px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .add-event-row button:hover { opacity: 0.88; }
  .footer { margin-top: 1.5rem; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Alex's Calendar</h1>
  <p>Click any day to view and add events</p>
  <div class="sync-status">
    <div class="sync-dot loading" id="sync-dot"></div>
    <span id="sync-label">Connecting…</span>
  </div>
</header>

<div class="calendar">
  <div class="cal-nav">
    <div class="nav-group">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
      <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
    </div>
    <div class="cal-title" id="cal-title"></div>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>
  <div class="day-headers" id="day-hdrs"></div>
  <div class="day-grid" id="day-grid"></div>
</div>

<div class="footer">Events sync across all your devices via Supabase.</div>

<div class="overlay" id="overlay">
  <div class="day-panel">
    <div class="day-panel-header">
      <h3 id="panel-title"></h3>
      <button class="panel-close" onclick="closePanel()">&#x2715;</button>
    </div>
    <div class="day-panel-events" id="panel-events"></div>
    <div class="day-panel-footer">
      <div class="add-event-row">
        <input type="text" id="panel-input" placeholder="Add an event..." maxlength="80" />
        <button onclick="panelAddEvent()">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Supabase config ──────────────────────────────────────────
const SB_URL = 'https://xlekesytyssjmtanpsdt.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsZWtlc3l0eXNzam10YW5wc2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDc1NzUsImV4cCI6MjA5NTkyMzU3NX0.AgKWPGLF7ZFVQFpqDlEumqoyvBGcxrsIlQYoSXNhdTE';
const HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };

// ── In-memory cache ──────────────────────────────────────────
let cache = {};   // { day_key: [events] }
let activeKey = null;

const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const today  = new Date();
let cur = new Date(today.getFullYear(), today.getMonth(), 1);

function dayKey(y, m, d) { return y + '-' + (m + 1) + '-' + d; }

// ── Sync status UI ───────────────────────────────────────────
function setSync(state, label) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('sync-label').textContent = label;
}

// ── Supabase helpers ─────────────────────────────────────────
async function fetchAllEvents() {
  setSync('loading', 'Connecting…');
  try {
    const res = await fetch(SB_URL + '/rest/v1/events?select=day_key,items', { headers: HEADERS });
    if (!res.ok) throw new Error('status ' + res.status);
    const rows = await res.json();
    cache = {};
    rows.forEach(r => { cache[r.day_key] = r.items || []; });
    setSync('ok', 'Synced');
    render();
  } catch(e) {
    setSync('err', 'Offline — changes saved locally');
    try { cache = JSON.parse(localStorage.getItem('cal-cache') || '{}'); } catch(_) {}
    render();
  }
}

async function persistDay(key) {
  const items = cache[key] || [];
  // always keep localStorage as backup
  localStorage.setItem('cal-cache', JSON.stringify(cache));
  try {
    if (items.length === 0) {
      // delete the row
      await fetch(SB_URL + '/rest/v1/events?day_key=eq.' + encodeURIComponent(key), { method: 'DELETE', headers: HEADERS });
    } else {
      await fetch(SB_URL + '/rest/v1/events', {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify({ day_key: key, items })
      });
    }
    setSync('ok', 'Saved');
  } catch(e) {
    setSync('err', 'Offline — will sync when reconnected');
  }
}

// ── Render calendar ──────────────────────────────────────────
function render() {
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById('cal-title').textContent = MONTHS[m] + ' ' + y;
  document.getElementById('day-hdrs').innerHTML = DAYS.map(d => `<div class="day-hdr">${d}</div>`).join('');

  const first = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  let cells = '';

  for (let i = 0; i < first; i++) {
    cells += `<div class="day-cell" style="opacity:0.4"><div class="day-num">${prevDays - first + 1 + i}</div></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const k = dayKey(y, m, d);
    const isToday = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
    const numClass = 'day-num current-month' + (isToday ? ' today' : '');
    const evList = cache[k] || [];
    const shown = evList.slice(0, 2).map(e => `<div class="mini-event">${e}</div>`).join('');
    const extra = evList.length > 2 ? `<div class="mini-event">+${evList.length - 2} more</div>` : '';
    cells += `<div class="day-cell" onclick="openPanel('${k}',${d})">
      <div class="${numClass}">${d}</div>${shown}${extra}
      <div class="add-hint">+ add</div>
    </div>`;
  }
  const remaining = 42 - first - daysInMonth;
  for (let d = 1; d <= remaining; d++) {
    cells += `<div class="day-cell" style="opacity:0.4"><div class="day-num">${d}</div></div>`;
  }
  document.getElementById('day-grid').innerHTML = cells;
}

// ── Panel ────────────────────────────────────────────────────
function renderPanel() {
  if (!activeKey) return;
  const evList = cache[activeKey] || [];
  const container = document.getElementById('panel-events');
  if (evList.length === 0) {
    container.innerHTML = `<p class="day-panel-empty">No events — add one below.</p>`;
    return;
  }
  container.innerHTML = evList.map((e, i) => `
    <div class="panel-event-row" id="evrow-${i}">
      <span>${e}</span>
      <div class="panel-action-btns">
        <button class="panel-edit" onclick="startEdit(${i})" title="Edit">&#9998;</button>
        <button class="panel-del" onclick="panelDeleteEvent(${i})" title="Delete">&#x2715;</button>
      </div>
    </div>`).join('');
}

function openPanel(k, d) {
  activeKey = k;
  const [y, m] = k.split('-');
  document.getElementById('panel-title').textContent = MONTHS[parseInt(m) - 1] + ' ' + d + ', ' + y;
  document.getElementById('panel-input').value = '';
  renderPanel();
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('panel-input').focus(), 80);
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  activeKey = null;
}

async function panelAddEvent() {
  const val = document.getElementById('panel-input').value.trim();
  if (!val || !activeKey) return;
  if (!cache[activeKey]) cache[activeKey] = [];
  cache[activeKey].push(val);
  document.getElementById('panel-input').value = '';
  renderPanel();
  render();
  await persistDay(activeKey);
}

async function panelDeleteEvent(idx) {
  if (cache[activeKey]) cache[activeKey].splice(idx, 1);
  if (cache[activeKey] && cache[activeKey].length === 0) delete cache[activeKey];
  renderPanel();
  render();
  await persistDay(activeKey);
}

function startEdit(idx) {
  const val = (cache[activeKey] || [])[idx] || '';
  const row = document.getElementById('evrow-' + idx);
  row.classList.add('editing');
  row.innerHTML = `
    <input class="edit-input" id="edit-input-${idx}" type="text" value="${val.replace(/"/g, '&quot;')}" maxlength="80" />
    <button class="edit-save" onclick="saveEdit(${idx})">Save</button>
    <button class="edit-cancel" onclick="renderPanel()">Cancel</button>`;
  const inp = document.getElementById('edit-input-' + idx);
  inp.focus();
  inp.selectionStart = inp.selectionEnd = inp.value.length;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveEdit(idx); if (e.key === 'Escape') renderPanel(); });
}

async function saveEdit(idx) {
  const inp = document.getElementById('edit-input-' + idx);
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  if (cache[activeKey]) cache[activeKey][idx] = val;
  renderPanel();
  render();
  await persistDay(activeKey);
}

function changeMonth(dir) { cur.setMonth(cur.getMonth() + dir); render(); }
function goToday() { cur = new Date(today.getFullYear(), today.getMonth(), 1); render(); }

document.getElementById('panel-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') panelAddEvent();
  if (e.key === 'Escape') closePanel();
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closePanel();
});

// ── Boot ─────────────────────────────────────────────────────
fetchAllEvents();
</script>
</body>
</html>
